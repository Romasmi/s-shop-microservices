syntax = "proto3";

package billing;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Romasmi/s-shop-microservices/billing-service/pkg/api;api";

message UserCreated {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  User user = 3;

  message User {
    string id = 1;
    string username = 2;
    string email = 3;
    string first_name = 4;
    string last_name = 5;
    string phone = 6;
    string password = 7;
    google.protobuf.Timestamp created_at = 8;
  }
}
