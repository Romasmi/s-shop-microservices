apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: s-shop-system
data:
  DB_NAME: "billing_service"
  AUTH_SERVICE_URL: "http://auth-service:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-secret
  namespace: s-shop-system
type: Opaque
stringData:
  DB_USER: "user"
  DB_PASSWORD: "password"
