apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: s-shop-system
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: app
          image: romasmi/order-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
          ports:
            - name: web
              containerPort: 8000
            - name: grpc
              containerPort: 9000
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
