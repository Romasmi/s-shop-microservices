apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: s-shop-system
data:
  DB_NAME: "order_service"
  USER_SERVICE_ADDR: "user-service:9000"
  BILLING_SERVICE_ADDR: "billing-service:9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-secret
  namespace: s-shop-system
type: Opaque
stringData:
  DB_USER: "user"
  DB_PASSWORD: "password"
